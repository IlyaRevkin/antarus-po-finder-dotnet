name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    # AntarusPoFinder.App is WPF (net8.0-windows) and AntarusPoFinder.Tests targets
    # net8.0-windows7.0 (it references App — see EndToEndSyncTests' header comment), so this needs a
    # Windows runner; a plain ubuntu-latest can't build either project.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  sync-server:
    # Служба обмена (tools/sync-server) — отдельный проект на Go, к решению .NET отношения не имеет,
    # поэтому и job отдельный: падение одного не должно прятать результат другого.
    # Собранный antarus-sync.exe лежит в репозитории (его ставит ИТ, где Go нет), и подменить
    # забытую пересборку CI не может — но хотя бы ловит правку, которая просто не компилируется.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: tools/sync-server/go.sum

      - name: Test
        working-directory: tools/sync-server
        run: go test ./...

      - name: Build
        working-directory: tools/sync-server
        run: go build -o antarus-sync-ci.exe .
